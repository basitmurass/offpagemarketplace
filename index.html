<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<title>OffPage Atlas — Backlink & Guest Post Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Sora:wght@400;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--on:#04130a;--bg:#0b1220;--side:#0d1526;--card:#121b30;--card2:#1a2440;--line:#263350;--txt:#e9eff9;--mut:#8b9bb8;--acc:#22c55e;--acc2:#16a34a;--accs:rgba(34,197,94,.12);--blue:#3b82f6;--blues:rgba(59,130,246,.14);--amb:#f59e0b;--ambs:rgba(245,158,11,.14);--red:#ef4444;--reds:rgba(239,68,68,.14);--pur:#a78bfa;--purs:rgba(167,139,250,.14);--sh:0 8px 24px rgba(0,0,0,.35)}
[data-theme=light]{--on:#fff;--bg:#eef3f1;--side:#fff;--card:#fff;--card2:#f3f7f5;--line:#dbe5e1;--txt:#10201b;--mut:#5b7169;--acc:#15803d;--acc2:#166534;--accs:rgba(21,128,61,.1);--sh:0 6px 18px rgba(16,32,27,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 Sora,'Noto Naskh Arabic',system-ui,'Segoe UI',Arial,sans-serif;display:flex;min-height:100vh}
.mono,.num{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
aside{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#0d9488);display:grid;place-items:center;font-style:normal;font-size:19px;color:var(--on)}
.brand b{font-size:16px;letter-spacing:-.3px;display:block;line-height:1.1}.brand small{color:var(--mut);font-size:10.5px}
.grp{font-size:10.5px;letter-spacing:1.2px;color:var(--mut);margin:16px 10px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;color:var(--txt);opacity:.82;padding:9px 11px;border-radius:10px;font:600 13px Sora,'Noto Naskh Arabic',sans-serif;cursor:pointer;text-align:left}
.nav:hover{background:var(--card2);opacity:1}.nav.on{background:var(--accs);border-color:var(--acc2);color:var(--acc);opacity:1}
.nav em{font-style:normal;width:18px;text-align:center}.nav .cb{margin-left:auto;background:var(--acc);color:var(--on);border-radius:9px;font-size:10.5px;padding:0 7px;font-weight:700}
.theme{margin-top:auto}
main{flex:1;min-width:0;padding:26px 30px 40px;max-width:1280px;display:flex;flex-direction:column;min-height:100vh}
h1{font-size:22px;margin:0 0 3px;letter-spacing:-.4px}.lead{color:var(--mut);margin:0 0 18px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h2{font-size:14px;margin:0 0 4px}.panel .sub{color:var(--mut);font-size:12px;margin:0 0 12px}
.banner{background:var(--accs);border:1px solid var(--acc2);color:var(--acc);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--c,var(--acc));border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--c,var(--acc))}
.tile .ic{width:40px;height:40px;border-radius:11px;margin:0 auto 10px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent)}
.tile .n{font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:700;color:var(--c,var(--acc));line-height:1.1}.tile .l{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px;cursor:pointer}
.bar .t{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:5px}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar b{text-align:right;font-family:'JetBrains Mono',monospace}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
label{display:block;font-size:11px;color:var(--mut);margin:0 0 4px;font-weight:600}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font:13px Sora,'Noto Naskh Arabic',sans-serif}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
select option{background:var(--card);color:var(--txt)}
textarea{min-height:110px;resize:vertical;font-size:12px}
.search{font-size:15px;padding:13px 14px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:20px;padding:5px 13px;font:600 12px Sora,'Noto Naskh Arabic',sans-serif;cursor:pointer}
.chip:hover{color:var(--txt)}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--on);border:0;border-radius:10px;padding:10px 16px;font:700 13px Sora,'Noto Naskh Arabic',sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28),0 8px 16px rgba(0,0,0,.22)}
.btn:hover{filter:brightness(1.1)}.btn.g{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn.g:hover{border-color:var(--acc);color:var(--acc)}
.btn.r{background:var(--reds);color:var(--red)}.btn.s{padding:6px 11px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.site{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.site:hover{border-color:var(--acc2);box-shadow:var(--sh)}
.site::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--bc,var(--acc))}
.sh{display:flex;gap:10px;align-items:center}
.fav{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--acc);flex:none;overflow:hidden}.fav img{width:22px;height:22px}
.wn{font-weight:700;font-size:14.5px;word-break:break-all;line-height:1.25}
.cc{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;background:var(--blues);color:var(--blue);border-radius:6px;padding:1px 6px;margin-right:5px}
.meta{font-size:11.5px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:12px;background:var(--purs);color:var(--pur);margin:10px 0 0;width:fit-content}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.met{background:var(--card2);border-radius:9px;padding:8px 2px;text-align:center}.met b{display:block;font-family:'JetBrains Mono',monospace;font-size:15px}.met small{font-size:10px;color:var(--mut);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--card2);color:var(--mut)}
.pill.ok{background:var(--accs);color:var(--acc)}.pill.bad{background:var(--reds);color:var(--red)}.pill.inf{background:var(--blues);color:var(--blue)}.pill.wa{background:var(--ambs);color:var(--amb)}
.price{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;margin:12px 0 0}.price small{font-size:11px;color:var(--mut);font-family:Sora}
.cp{font-size:11.5px;color:var(--mut)}.site a.sl{color:var(--blue);font-size:12px;font-weight:600;text-decoration:none;margin-top:6px}
.site .btn{margin-top:12px;width:100%}.site .btn.in{background:var(--accs);color:var(--acc);border:1px solid var(--acc2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-size:11px;font-weight:700}.tw{overflow-x:auto}
.sites-table{table-layout:fixed;width:100%;min-width:1060px}
.sites-table th,.sites-table td{overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.sites-table td.wsite{white-space:normal;word-break:break-word}
.st{font-size:11px;font-weight:700;padding:2px 10px;border-radius:12px;background:var(--ambs);color:var(--amb)}.st.Progress{background:var(--blues);color:var(--blue)}.st.Completed{background:var(--accs);color:var(--acc)}.st.Cancelled{background:var(--card2);color:var(--mut)}
.crow{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.f3{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tot{text-align:right;font-size:18px;font-weight:700;margin:14px 0}.tot span{color:var(--acc);font-family:'JetBrains Mono',monospace}
.empty{text-align:center;color:var(--mut);padding:30px;grid-column:1/-1}
.al{border-radius:10px;padding:10px 13px;font-size:12.5px;margin:10px 0;background:var(--blues);color:var(--blue)}.al.ok{background:var(--accs);color:var(--acc)}.al.w{background:var(--ambs);color:var(--amb)}
code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:11px}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:12px;margin-top:8px}
#toast{position:fixed;bottom:22px;right:22px;background:var(--acc);color:var(--on);font-weight:700;padding:11px 18px;border-radius:10px;box-shadow:var(--sh);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}#toast.show{opacity:1;transform:none}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.nav em .i{width:18px;height:18px}.tile .ic .i{width:20px;height:20px}.brand i .i{width:21px;height:21px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--mut);font:700 12px Sora,'Noto Naskh Arabic',sans-serif;padding:5px 11px;border-radius:7px;cursor:pointer}.seg button.on{background:var(--acc);color:var(--on)}
.ratebox{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px 12px;background:var(--card2)}.ratebox summary{cursor:pointer;font-size:14px;padding:2px}.ratebox .tw{margin-top:8px}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sv{display:flex;gap:12px;align-items:center;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--txt);font:inherit;transition:transform .18s,border-color .18s,background .18s}
.sv:hover{border-color:var(--acc);transform:translateY(-2px)}.sv.on{border-color:var(--acc);background:var(--accs)}
.sv .ib{width:42px;height:42px;border-radius:11px;background:var(--accs);color:var(--acc);display:grid;place-items:center;font-size:20px;flex:none}
.sv b{display:block;font-size:14px}.sv small{color:var(--mut);font-size:11.5px;display:block}.sv .n{margin-inline-start:auto;font:700 18px 'JetBrains Mono',monospace;color:var(--acc)}
.facet{margin-top:14px}.fl{font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:6px}.facet .chips{margin:0}
.chip i{font-style:normal;opacity:.65;margin-inline-start:4px;font-family:'JetBrains Mono',monospace;font-size:11px}
.chip .cc{margin-inline-end:6px}.chip.on .cc{background:rgba(0,0,0,.18);color:var(--on)}
.site{transition:transform .18s,box-shadow .18s,border-color .18s}.site:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.42);border-color:var(--acc2)}
/* v3.43 */
.paybox{margin-top:16px}
.payrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.paylogo{font-weight:800;font-size:13px;color:#fff;padding:6px 14px;border-radius:9px;letter-spacing:.3px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.paylogo.jazz{background:linear-gradient(180deg,#e53935,#a30000)}
.paylogo.ep{background:linear-gradient(180deg,#43a047,#1b5e20)}
.ck{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--acc)}
.supedit{display:inline-flex;gap:6px;align-items:center}
.supedit input{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px}
#themeBtn{font-size:19px}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}.payrow{gap:8px}.top{gap:6px}.crow .f2{grid-template-columns:1fr}}
.btn{transition:filter .15s,transform .08s,box-shadow .08s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28),0 3px 8px rgba(0,0,0,.2)}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn.g,.btn.r{box-shadow:none}
.chip{transition:border-color .15s,color .15s}

.top{display:flex;align-items:center;gap:14px;margin:-8px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line);position:relative}
#themeBtn{display:inline-flex;align-items:center;justify-content:center;color:var(--acc)}
#themeBtn svg{width:20px;height:20px;transition:transform .45s ease,opacity .3s ease}
#themeBtn .ic-sun{display:none}
[data-theme="light"] #themeBtn .ic-sun{display:block}
[data-theme="light"] #themeBtn .ic-moon{display:none}
#themeBtn:active svg{transform:rotate(120deg) scale(.85)}
.hqbadge{display:inline-block;padding:8px 20px;border-radius:999px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#12b981,#0b7a55);box-shadow:0 4px 14px rgba(14,159,110,.35);letter-spacing:.2px}
#topBtn{position:fixed;right:22px;bottom:22px;z-index:70;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--acc),#0b7a55);box-shadow:0 6px 18px rgba(0,0,0,.32);opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .3s,transform .3s}
#topBtn.show{opacity:1;pointer-events:auto;transform:none}
#topBtn:hover{transform:translateY(-3px)}
#topBtn svg{width:22px;height:22px}
.loginwrap{display:flex;justify-content:center;padding:52px 16px}
.logincard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:38px 34px;box-shadow:0 12px 40px rgba(0,0,0,.18);text-align:center}
.loginlogo{font-size:42px;margin-bottom:8px}
.logincard h1{font-size:26px;margin:0 0 4px;font-weight:500}
.logincard .lead{margin:0 0 20px}
.loginuser{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 18px 6px 6px;margin:0 auto 20px;width:fit-content;max-width:100%;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lav{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.logincard label{display:block;text-align:left;font-size:13px;font-weight:600;margin-bottom:6px}
.logincard input{width:100%;box-sizing:border-box}
.loginbtn{width:100%;margin-top:18px;padding:12px;font-size:15px;border-radius:999px}
.iconbtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:0 0 auto}
.iconbtn .bdg{position:absolute;top:-5px;right:-5px;background:#e0245e;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;line-height:18px;border-radius:9px;text-align:center;padding:0 4px}
.bellpop{position:absolute;top:54px;right:8px;width:340px;max-height:400px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.20);z-index:60;padding:8px}
.bellpop .brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:10px;cursor:pointer}
.bellpop .brow:hover{background:var(--bg)}
.newtag{display:inline-block;background:#e0245e;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:6px}
.top b{display:block;font-size:14px}.top small{color:var(--mut);font-size:11.5px}.top input{max-width:340px;margin-left:auto}
.av{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;background:radial-gradient(circle at 15% 0,rgba(34,197,94,.16),transparent 55%),var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}
.hero h1{font-size:30px;margin:8px 0}.hero h1 span,.heroHome h1 span,.login h1 span{color:var(--acc)}
.hc{display:inline-block;border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:600;margin:4px 6px 0 0}
.badge{display:inline-block;background:var(--accs);color:var(--acc);border-radius:20px;padding:3px 12px;font-size:11.5px;font-weight:700}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}.mini.m3{grid-template-columns:repeat(3,1fr);margin-top:6px}
.mini div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini b{font-family:'JetBrains Mono',monospace;font-size:21px;display:block;line-height:1.2}.mini small{color:var(--mut);font-size:11px;font-weight:600}
.spark{width:100%;height:60px;display:block;margin:10px 0}
.sec{font-size:15px;font-weight:700;margin:22px 0 10px}
.vbox{margin-top:16px;border:1px dashed var(--acc2);background:var(--accs);border-radius:12px;padding:14px}.vbox h2{font-size:13px;margin:0 0 10px;color:var(--acc)}
.login{display:grid;grid-template-columns:1.2fr 1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;max-width:880px;margin:24px auto;background:var(--card)}
.lb{padding:36px;background:radial-gradient(circle at 20% 0,rgba(34,197,94,.2),transparent 60%)}.lb ul{color:var(--mut);padding-left:18px;line-height:2}
.lf{padding:36px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.lf .btn{margin-top:14px}
.wabtn{display:inline-block;text-decoration:none}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.svc{grid-template-columns:1fr}.hero,.login{grid-template-columns:1fr}.lf{border-left:0}.top input{display:none}body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}.brand{padding:0 8px 0 0}.grp{display:none}.nav{width:auto}.theme{margin:0}main{padding:16px}.tiles{grid-template-columns:repeat(2,1fr)}.two,.grid,.f2{grid-template-columns:1fr}.fgrid,.f3{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
footer{border-top:1px solid var(--line);padding:26px 16px;text-align:center;color:var(--mut);font-size:13px;margin-top:auto;background:var(--card);border-radius:14px}
#app{padding-bottom:34px}
.al.bad{background:#fde8e8;color:#c0392b}
.lockwrap{min-height:82vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;max-width:430px;width:100%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.12)}
.lockcard input{width:100%;margin-top:6px}
body.locked aside{display:none}
body.locked .top{display:none}

/* ---------- v3.34: IndexedDB for large data (GBs, not 5MB localStorage limit) ---------- */
const IDB=(()=>{
  let db=null;
  const ready=new Promise(res=>{
    try{
      const r=indexedDB.open("offpage-atlas",1);
      r.onupgradeneeded=e=>{try{e.target.result.createObjectStore("kv")}catch(_){}};
      r.onsuccess=e=>{db=e.target.result;res(true)};
      r.onerror=()=>res(false);
    }catch(_){res(false)}
  });
  const tx=(mode,fn)=>new Promise(res=>{
    if(!db)return res(null);
    try{
      const t=db.transaction("kv",mode),s=t.objectStore("kv"),rq=fn(s);
      rq.onsuccess=e=>res(e.target.result);
      rq.onerror=()=>res(null);
    }catch(_){res(null)}
  });
  return{ready,get:k=>tx("readonly",s=>s.get(k)),set:(k,v)=>tx("readwrite",s=>s.put(v,k))};
})();

function filt(o={}){
  const f=state.f,k=o.loose?.7:1;let a=DB.get("sites",[]);
  if(f.service!=="All")a=a.filter(s=>s.service===f.service);
  const cq=f.cat.trim().toLowerCase(),oq=f.country.trim().toLowerCase();
  if(!o.skipCat&&cq)a=a.filter(s=>s.category.toLowerCase().includes(cq));
  if(!o.skipCountry&&oq)a=a.filter(s=>{const c=s.country||"";return c.toLowerCase().includes(oq)||cc(c).toLowerCase()===oq});
  if(f.q.trim()){const q=f.q.toLowerCase().trim();a=a.filter(s=>[s.website,s.category,s.tags,s.keywords,s.remarks,s.country,s.service].map(x=>String(x==null?"":x)).join(" ").toLowerCase().includes(q))}
  const da=num(f.da),dr=num(f.dr),sp=num(f.spam),tr=num(f.traf);
  if(da!=null)a=a.filter(s=>(+s.da||0)>=da*k);
  if(dr!=null)a=a.filter(s=>(+s.dr||0)>=dr*k);
  if(sp!=null)a=a.filter(s=>s.spam!==""&&s.spam!=null&&+s.spam<=(o.loose?sp*1.5+1:sp));
  if(tr!=null)a=a.filter(s=>tnum(s.traffic)>=tr*k);
  if(f.lt!=="All")a=a.filter(s=>s.linkType===f.lt);
  if(f.idx!=="All")a=a.filter(s=>s.indexing===f.idx);
  const key={dr:s=>-(+s.dr||0),da:s=>-(+s.da||0),spam:s=>s.spam===""||s.spam==null?999:+s.spam,traf:s=>-tnum(s.traffic),pa:s=>+s.price||0,pd:s=>-(+s.price||0)}[f.sort];
  return a.sort((x,y)=>key(x)-key(y));
}

function splitCSV(l){const o=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if((ch===","||ch==="|"||ch===";")&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o.map(s=>s.trim())}
function parseImportCSV(txt){
  const L=(txt||"").split(/\r?\n/).filter(l=>l.trim());
  if(L.length<2)return{rows:[],cats:[],cfields:[]};
  const H=splitCSV(L[0]).map(h=>h.toLowerCase().replace(/[^a-z]/g,"")),ix=f=>H.findIndex(h=>f(h)),
  G={web:Math.max(0,ix(h=>h.indexOf("website")===0)),cat:ix(h=>h.indexOf("category")===0),co:ix(h=>h==="country"),da:ix(h=>h==="da"),dr:ix(h=>h==="dr"),sp:ix(h=>h.includes("spam")),tr:ix(h=>h==="traffic"),lt:ix(h=>h.includes("linktype")),ix:ix(h=>h==="indexing"),pr:ix(h=>h==="price"||h==="pricepkr"||h==="generalprice"||h==="myprice"),cp:ix(h=>h.includes("casino")),tat:ix(h=>h==="tat"),sam:ix(h=>h.includes("sample")),tag:ix(h=>h==="tags"||h==="keywords"),rem:ix(h=>h==="remarks"),svc:ix(h=>h==="service"||h==="type"),ssub:ix(h=>h.includes("subtype")||h.includes("servicetype")||h==="typedetail"),ven:ix(h=>h==="vendor"||h==="supplier"||h.includes("suppliername")||h.includes("vendorname")||h.includes("sellername")||h.includes("seller")||h==="uploader"),vwa:ix(h=>h.includes("whatsapp")||h.includes("whtsapp")||h.includes("whatsup")||h.includes("supplierphone")||h.includes("vendorphone")||h.includes("sellerphone")||h==="phone"||h==="mobile"||h.includes("phonenumber")||h.includes("mobilenumber")||h.includes("contactnumber")),cost:ix(h=>h==="cost"||h==="costprice"),pusd:ix(h=>h==="usd"||h.includes("priceusd")||h.includes("usdprice")),tl:ix(h=>h==="toplocation"||h==="toploc"||h==="location"),adv:ix(h=>h.includes("paymentadvance")||h==="advance"),gp:ix(h=>h==="guestpostprice"||h==="guest"||h==="guestprice"),li:ix(h=>h==="liprice"||h==="listprice"||h==="list")};
  const rawH=splitCSV(L[0]),usedIx=new Set(Object.values(G).filter(v=>v>-1)),cix=rawH.map((h,i)=>({h:h.trim(),i})).filter(x=>x.h&&!usedIx.has(x.i));
  const rows=[],cats=[],seen=new Set();
  for(let i=1;i<L.length;i++){
    const p=splitCSV(L[i]),g=k=>G[k]>-1?(p[G[k]]||""):"",web=normWeb(g("web"));
    if(!web||seen.has(web.toLowerCase()))continue;
    seen.add(web.toLowerCase());
    let cat=g("cat")||"General";const _svc=g("svc"),_isBL=/^back/i.test(_svc)||/forum|image|profile|directory|bookmark|citation|comment|web ?2|backlink|nofollow|\.edu|qna/i.test(g("cat"));if(!cat||cat.toLowerCase()==="general"){const _nc=_isBL?detectBacklinkType(web,g("tag")):detectNiche(web,g("tag"));if(_nc)cat=_nc}if(!cats.includes(cat))cats.push(cat);
    const tlm=g("tl").match(/\(([a-z]{2})\b/i),tlc=tlm?TLD[tlm[1].toLowerCase()]:"";
    const custom={};cix.forEach(x=>{const vv=(p[x.i]||"").trim();if(vv)custom[x.h]=vv});
    const s={website:web,category:cat,country:g("co")||tlc||detectCountry(web),da:g("da"),dr:g("dr"),spam:g("sp").replace(/[^\d.]/g,""),traffic:g("tr"),linkType:/no/i.test(g("lt"))?"Nofollow":"Dofollow",indexing:/non/i.test(g("ix"))?"Non Indexable":"Indexable",price:+g("pr").replace(/[^\d]/g,"")||0,priceUSD:g("pusd").replace(/[^\d.]/g,""),casinoPrice:+g("cp").replace(/[^\d]/g,"")||"",tat:g("tat"),samples:g("sam"),tags:g("tag"),remarks:g("rem"),service:(()=>{const _v=g("svc"),_h=SVCS().find(x=>x.toLowerCase()===_v.toLowerCase());if(_h)return _h;if(/^back/i.test(_v))return"Backlink";if(/^guest/i.test(_v))return"Guest Post";return /forum|image|profile|directory|bookmark|citation|comment|web ?2|backlink|nofollow|\.edu|qna/i.test(cat)?"Backlink":"Guest Post"})(),serviceSub:g("ssub"),vendor:g("ven"),vendorWA:g("vwa"),cost:+g("cost").replace(/[^\d]/g,"")||"",payAdvance:g("adv"),guestPrice:g("gp").replace(/[^\d.]/g,""),liPrice:g("li").replace(/[^\d.]/g,""),custom};
    autoUSD(s);rows.push(s);
  }
  return{rows,cats,cfields:[...new Set(cix.map(x=>x.h))]};
}
function doImport(txt,ven,vwa){
  const R=parseImportCSV(txt);
  if(!R.rows.length)return toast("Header + kam az kam 1 row chahiye");

  R.rows.forEach(r=>{
    const k=r.website.toLowerCase();
    if(have.has(k)){skip++;return}
    have.add(k);r.id=uid();
    if(!cats.includes(r.category)){cats.push(r.category);nc.push(r.category)}
    if(ven){r.vendor=ven;r.vendorWA=vwa||r.vendorWA}
    sites.push(r);add++;
  });
  DB.set("sites",sites);DB.set("categories",cats);
  const cfNames=DB.get("customFields",[]);
  const newCF=R.cfields.filter(h=>!cfNames.includes(h));if(newCF.length)DB.set("customFields",cfNames.concat(newCF));
  if(ven)saveSupplier(ven,vwa);
  $("#imp").innerHTML=`<div class="al ok">✅ <b>${add}</b> sites add hui${ven?` — supplier: <b>${esc(ven)}</b>`:""}${nc.length?`, nayi categories: <b>${nc.map(esc).join(", ")}</b>`:""}${skip?` (${skip} skip)`:""}</div>`;
}

const PRIV_KEYS=["vendor","vendorWA","cost","guestPrice","liPrice","payAdvance"];

function normWeb(w){return String(w||"").toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/$/,"").trim()}
function normalizeLiveURL(u){
  u=String(u||"").trim();
  if(!u)return "";
  if(/\/spreadsheets\/d\/[a-zA-Z0-9-_]+\/edit/.test(u))return {err:"Edit wala link nahi — File → Share → Publish to web se CSV link lo 📡"};
  let m=u.match(/\/spreadsheets\/d\/e\/([a-zA-Z0-9-_]+)/);
  if(m){
    const id=m[1];
    let gid=(u.match(/[?&]gid=(\d+)/)||[])[1]||"";
    let base="https://docs.google.com/spreadsheets/d/e/"+id+"/pub";
    return base+"?"+(gid?("gid="+gid+"&"):"")+"single=true&output=csv";
  }
  if(u.indexOf("output=csv")<0){
    return {err:"Ye CSV link nahi lag raha — Publish to web se /pub wala link lo 📡"};
  }
  return u;
}

}

function extractPrivate(){
  const all=DB.get("sites",[]),priv=DB.get("priv",{}),have=new Set();
  all.forEach(x=>{const d=normWeb(x.website);if(!d)return;have.add(d);
    const o={};PRIV_KEYS.forEach(k=>{const v=x[k];if(v!==""&&v!=null)o[k]=v});
    if(Object.keys(o).length)priv[d]=Object.assign(priv[d]||{},o);else if(priv[d])delete priv[d];});
  Object.keys(priv).forEach(d=>{if(!have.has(d))delete priv[d]});
  DB.set("priv",priv);
}
function applyPrivate(sites){
  const priv=DB.get("priv",{}),a=sites||DB.get("sites",[]);
  a.forEach(x=>{const o=priv[normWeb(x.website)]||priv[String(x.website||"").toLowerCase()];if(o)Object.assign(x,o)});
  if(!sites)DB.set("sites",a);
  return a;
}

function compactSites(sites){
  return sites.map(s=>{
    const o={};
    for(const k in s){
      if(k==="id")continue;
      const v=s[k];
      if(v===""||v==null||v===0&&k!=="price")continue;
      if(k==="custom"&&typeof v==="object"&&!Object.keys(v).length)continue;
      o[k]=v;
    }
    if(!o.id&&o.website)o.id="w-"+normWeb(o.website);
    return o;
  });
}
async function refreshLiveSheet(manual){
  const url=liveURL();
  if(!url){if(manual)toast("Pehle Settings me Live Sheet ka CSV link dalo 📡");return false}
  const done=(ok,msg)=>{if(manual)toast(msg);return ok};
  try{
    const r=await fetch(url+(url.indexOf("?")>=0?"&":"?")+"_="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("http");
    const R=parseImportCSV(await r.text());
    if(!R.rows.length)throw new Error("empty");
    const cur=DB.get("sites",[]);
    
    extractPrivate();
    R.rows.forEach(s=>{s.id="w-"+normWeb(s.website)});
    const _cs=compactSites(applyPrivate(R.rows));
    try{DB.set("sites",_cs)}catch(qe){
      const _slim=_cs.map(s=>{const o={};["website","category","country","da","dr","traffic","price","priceUSD","service","linkType","tat"].forEach(k=>{if(s[k]!==""&&s[k]!=null)o[k]=s[k]});o.id=s.id;return o});
      try{DB.set("sites",_slim);toast("⚠️ Storage full — sirf zaroori fields save huin")}
      catch(e2){throw new Error("storage-full")}
    }
    const cats=DB.get("categories",[]);let ch=false;
    R.cats.forEach(c=>{if(!cats.includes(c)){cats.push(c);ch=true}});if(ch)DB.set("categories",cats);
    const cfNames=DB.get("customFields",[]),newCF=R.cfields.filter(h=>!cfNames.includes(h));
    if(newCF.length)DB.set("customFields",cfNames.concat(newCF));
    DB.set("livemeta",{at:Date.now(),n:R.rows.length});
    const ls=document.querySelector("#liveStat");if(ls)ls.textContent=liveStat();
    render();
    return done(true,"✅ Live sheet: "+R.rows.length+" sites aa gayin");
  }catch(e){return done(false,e&&e.message==="storage-full"?"⚠️ Data bohat zyada hai — sheet me rows kam karo":"⚠️ Live sheet nahi khul rahi — link/publish check karo")}
}
function doExcel(file,ven,vwa){
  if(typeof XLSX==="undefined")return toast("Excel library load nahi hui — internet check karo");
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"array"});let rows=[];
      wb.SheetNames.forEach(sn=>{
        if(/guideline|instruction/i.test(sn))return;
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false});
        const WEBRE=/^\s*web\s*sites?\b/i;const his=[];aoa.forEach((rr,i)=>{if(rr.some(c=>WEBRE.test(String(c||""))))his.push(i)});
        if(!his.length)return;
        his.forEach((hi,bi)=>{
          const head=aoa[hi].map(c=>String(c||"").trim());
          const wix=head.findIndex(h=>WEBRE.test(h));
          if(wix<0)return;
          const end=bi+1<his.length?his[bi+1]:aoa.length;
          aoa.slice(hi+1,end).forEach(rr=>{
            const wv=String(rr[wix]||"").trim();
            if(!wv||WEBRE.test(wv))return;
            const o={};head.forEach((hh,ii)=>{if(hh)o[hh]=rr[ii]||""});
            o["__sheetcat"]=sn.replace(/_/g," ").trim();
            rows.push(o);
          });
        });
      });
      if(!rows.length)return toast("Koi website wali sheet nahi mili");
      const keys=[...new Set(rows.flatMap(o=>Object.keys(o).filter(k=>!k.startsWith("__"))))];
      if(!keys.some(k=>/category/i.test(k)))keys.push("Category");
      const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
      const csv=[keys.join(","),...rows.map(o=>keys.map(k=>{let v=o[k];if((v===undefined||v==="")&&/category/i.test(k))v=o["__sheetcat"]||"";return q(v||"")}).join(","))].join("\n");
      doImport(csv,ven,vwa);
    }catch(err){toast("Excel read error")}
  };
  r.readAsArrayBuffer(file);
}
